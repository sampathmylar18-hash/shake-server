<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shake the life - Live Tracking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
        }

        #bar {
            padding: 12px 16px;
            background: #b00020;
            color: #fff;
            font-weight: bold;
        }

        #info {
            padding: 8px 16px;
            background: #f5f5f5;
            font-size: 14px;
        }

        #map {
            height: calc(100vh - 90px);
        }
    </style>
</head>

<body>
    <div id="bar">SOS Alert - Live Location</div>
    <div id="info">Waiting for location...</div>
    <div id="map"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script>
        const id = new URLSearchParams(location.search).get("id");
        const info = document.getElementById("info");

        const map = L.map("map").setView([20.59, 78.96], 5);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        let marker = null;
        let firstFix = true;
        const path = [];

        async function update() {
            if (!id) {
                info.textContext = "No alert id in the link";
                return;
            }
            try {
                const res = await fetch("/api/location/" + id);
                if (!res.ok) {
                    info.textContent = "Waiting for alert " + id + "...";
                    return;
                }
                const data = await res.json();
                const pos = [data.lat, data.lng];

                if (!marker) marker = L.marker(pos).addTo(map);
                else marker.setLatLng(pos);

                const last = path[path.length - 1];
                if (!last || last[0] !== pos[0] || last[1] !== pos[1]) {
                    path.push(pos);
                    L.polyline(path, { color: "red" }).addTo(map);
                }

                if (firstFix) {
                    map.setView(pos, 17);
                    firstFix = false;
                }

                const secs = Math.round((Date.now() - data.time) / 1000);
                info.textContent = "Alert " + id + " | " + data.lat.toFixed(5) + ", " +
                    data.lng.toFixed(5) + " | updated " + secs + "s ago";
            } catch (e) {
                info.textContext = "cannot reach server....";
            }
        }

        update();
        setInterval(update, 3000);
    </script>
</body>

</html>
